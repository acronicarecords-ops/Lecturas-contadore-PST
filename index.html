<style>
:root{
  --navy:#242254; --navy-2:#332f74; --sea:#006227; --sea-dark:#00431b;
  --sand:#f3f5f2; --card:#ffffff; --ink:#1c1b33; --muted:#5c6260; --line:#dbe3dc;
  --coral:#b5502e; --ok:#006227; --ok-bg:#e8f4ea; --ok-border:#b7dcc0;
  --header-muted:#bcb8de; --radius:10px; --field:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--navy);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--sand); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
#app{display:flex;flex-direction:column;height:100%;}

/* Header */
header{background:var(--navy);color:#fff;padding:14px 18px 10px;flex-shrink:0;}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-logo{height:32px;width:auto;border-radius:6px;display:block;flex-shrink:0;}
.brand-text h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em;}
.brand-text span{font-size:12px;color:var(--header-muted);}
.btn{border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;}
.btn:active{transform:translateY(1px);}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;}
.cfg-btn{width:34px;height:34px;padding:0;font-size:22px;line-height:1;flex-shrink:0;}
.btn-sea{background:var(--sea);color:#fff;}
.btn-coral{background:var(--coral);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
.status-line{font-size:12px;color:var(--header-muted);margin-top:8px;display:flex;align-items:center;gap:10px;}
.status-line b{color:#fff;}
.bar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;}
.bar i{display:block;height:100%;background:#4fc97d;width:0;transition:width .25s;}

/* Tabs */
.tabbar-wrap{background:var(--navy-2);overflow-x:auto;flex-shrink:0;border-bottom:3px solid var(--sea);scrollbar-width:none;}
.tabbar-wrap::-webkit-scrollbar{display:none;}
.tabbar{display:flex;gap:2px;padding:0 8px;min-width:max-content;}
.tab{padding:10px 16px;font-size:13px;font-weight:700;color:#cddbe6;background:transparent;border:none;cursor:pointer;
  white-space:nowrap;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px;font-family:inherit;}
.tab.active{background:#e2e2e2;color:#20305a;}
.tab .count{font-weight:600;font-size:10px;background:rgba(255,255,255,.15);color:#fff;padding:1px 6px;border-radius:20px;}
.tab.active .count{background:var(--sea);}
.tab.done .count{background:#4fc97d;color:#0b2a17;}

/* Content */
main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
.zone-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.zone-title{font-size:16px;font-weight:700;color:var(--navy);}
.zone-sub{font-size:12px;color:var(--muted);}
.list{display:flex;flex-direction:column;gap:8px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;
  display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:start;}
.card.full{background:var(--ok-bg);border-color:var(--ok-border);}
.num{grid-row:span 2;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;
  font-size:20px;color:var(--sea-dark);text-align:center;padding-top:14px;position:relative;}
.num .tick{display:none;margin:4px auto 0;width:20px;height:20px;border-radius:6px;background:var(--ok);}
.num .tick svg{width:14px;height:14px;stroke:#fff;margin:3px;}
.card.full .num .tick{display:block;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 3px 2px;}
.fld label .u{text-transform:none;font-weight:600;opacity:.8;}
.fld input{width:100%;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--field);color:var(--ink);font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;}
.fld input.n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;}
.fld input:focus{border-color:var(--sea);box-shadow:0 0 0 3px rgba(0,98,39,.15);}
.fld.el label{color:#8a6a00;}
.fld.ag label{color:#1f5f9e;}
.obs{grid-column:2;}
.card.lbl{grid-template-columns:76px 1fr;}
.card.lbl .num{font-family:inherit;font-size:13px;line-height:1.25;word-break:break-word;padding-top:16px;}
.brow .items{grid-column:span 2;text-align:left;font-family:inherit;}
.obs-btn{display:block;width:100%;text-align:left;background:none;border:1px dashed var(--line);border-radius:8px;padding:7px 10px;
  font-size:13px;font-weight:600;color:var(--sea-dark);font-family:inherit;cursor:pointer;margin-top:2px;}
.obs-btn.has{border-style:solid;background:var(--field);color:var(--ink);font-weight:400;white-space:pre-wrap;word-break:break-word;}
.obs-l{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px;}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,19,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:10;}
.modal.open{display:flex;}
.sheet{background:var(--sand);width:100%;max-width:560px;max-height:88%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.sheet-head{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
.sheet-head h2{font-size:15px;margin:0;}
.sheet-body{overflow-y:auto;padding:18px 16px 16px;min-height:50vh;display:flex;flex-direction:column;}
.share-btn{width:100%;font-size:15px;padding:13px 16px;margin-bottom:auto;}
#clearAll{margin-top:24px;}
.sheet-body::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#c4c7cc;margin:-8px auto 14px;}
.sheet-foot{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);}
.brow{display:grid;grid-template-columns:1fr 64px 64px 32px;gap:6px;align-items:center;margin-bottom:6px;}
.brow input{width:100%;font-size:15px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--ink);font-family:inherit;}
.brow input.n{text-align:center;font-family:ui-monospace,Menlo,monospace;}
.bhead{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.del{background:none;border:none;color:var(--coral);font-size:20px;cursor:pointer;}
.note{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.4;}
.dlg{position:fixed;inset:0;background:rgba(20,19,40,.55);display:none;align-items:center;justify-content:center;z-index:15;padding:24px;}
.dlg.open{display:flex;}
.dlg-box{background:var(--card);border-radius:14px;padding:20px 18px 16px;width:100%;max-width:320px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.dlg-box p{margin:0 0 18px;font-size:15px;font-weight:600;color:var(--ink);line-height:1.4;}
.dlg-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.preview{position:fixed;inset:0;z-index:12;background:#5b6070;display:none;flex-direction:column;}
.preview.open{display:flex;}
.pv-bar{background:#20305a;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;flex-shrink:0;border-bottom:3px solid #1a5632;}
.pv-btn{padding:9px 14px;font-size:14px;}
.pv-info{font-size:12px;color:#b9c3dc;font-family:"Manrope",-apple-system,sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.pv-pages{flex:1;overflow:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;-webkit-overflow-scrolling:touch;}
.pv-page{background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);border-radius:2px;flex-shrink:0;}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;
  font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;}
.toast.show{opacity:1;}

/* ===== Zona de contenido: diseño corporativo (igual que Gestor PST Corporativo) ===== */
:root{color-scheme:light;
  --c-navy:#20305a; --c-sea:#1a5632; --c-sky:#3ea8e0; --c-sand:#e2e2e2; --c-cream:#fbf7f3; --c-muted:#666666; --c-line:#d6d8dc;
  --c-ok-bg:#e4f1e7; --c-ok-border:#a9d1b4;
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:var(--c-sand);}
.tab.active{background:var(--c-sand);color:var(--c-navy);}
main{background:var(--c-sand);color:var(--c-navy);font-family:var(--f-body);padding:18px 16px;}
.zone-header{align-items:center;}
.zone-title{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:-.5px;color:var(--c-navy);line-height:1.1;}
.zone-sub{font-family:var(--f-body);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--c-muted);font-variant-numeric:tabular-nums;}
.list{gap:6px;}
.card{background:#fff;border:1px solid transparent;border-radius:6px;padding:12px;box-shadow:0 1px 0 rgba(32,48,90,.06);}
.card.full{background:var(--c-ok-bg);border-color:var(--c-ok-border);}
.num{font-family:var(--f-body);font-weight:800;font-size:20px;color:var(--c-sea);font-variant-numeric:tabular-nums;}
.card.lbl .num{font-family:var(--f-body);font-weight:700;color:var(--c-navy);}
.fld label{font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--c-muted);}
.fld.el label,.fld.ag label{color:var(--c-muted);}
.fld input{font-family:var(--f-body);border-radius:6px;border-color:var(--c-line);background:#fff;color:var(--c-navy);}
.fld input.n{font-family:var(--f-body);font-weight:700;font-variant-numeric:tabular-nums;}
.fld input:focus{border-color:var(--c-sky);box-shadow:0 0 0 3px rgba(62,168,224,.18);}
.obs-btn{font-family:var(--f-body);border-radius:6px;border-color:var(--c-line);color:var(--c-sky);}
.obs-btn.has{background:#fff;color:var(--c-navy);}
.obs-l{letter-spacing:.08em;color:var(--c-muted);}
.empty{font-family:var(--f-body);color:var(--c-muted);}
main .zone-header{align-items:flex-start;}
main .zone-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto;}
main .order-btn{border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;background:#20305a;color:#fff;
  font-family:"Manrope",-apple-system,sans-serif;letter-spacing:.02em;cursor:pointer;-webkit-tap-highlight-color:transparent;}
main .order-btn.desc{background:#1a5632;}
main .order-btn:active{transform:translateY(1px);}
/* ===== Zona de atraques: diseño corporativo claro (como Gestor PST Corporativo) ===== */
main{background:#e2e2e2;color:#20305a;font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:18px 16px;color-scheme:light;}
main .zone-title{font-family:"DM Serif Display",Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;letter-spacing:-.5px;color:#20305a;line-height:1.1;}
main .zone-sub{font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:#666;font-variant-numeric:tabular-nums;}
main .list{gap:6px;}
main .card{background:#fff;border:1px solid transparent;border-radius:6px;padding:12px;box-shadow:0 1px 0 rgba(32,48,90,.06);}
main .card.full{background:#e4f1e7;border-color:#a9d1b4;}
main .num{font-family:"Manrope",-apple-system,sans-serif;font-weight:800;font-size:20px;color:#20305a;font-variant-numeric:tabular-nums;}
main .card.lbl .num{font-weight:700;font-size:13px;}
main .fld label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#666;}
main .fld.el label,main .fld.ag label{color:#666;font-size:11px;font-weight:800;}
main .fld label{white-space:nowrap;overflow:hidden;text-overflow:clip;}
main .fld.el label,main .fld.ag label{font-size:clamp(9.5px,2.9vw,11px);letter-spacing:clamp(.01em,.4vw,.08em);}
main .row{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(6px,2vw,10px);}
main .card{grid-template-columns:clamp(38px,11vw,56px) minmax(0,1fr);column-gap:clamp(6px,2.5vw,12px);padding:12px clamp(8px,2.5vw,14px);}
main .card.lbl{grid-template-columns:clamp(60px,18vw,90px) minmax(0,1fr);}
main .num{font-size:clamp(16px,4.8vw,20px);}
main .fld input{min-width:0;padding:8px clamp(6px,2vw,10px);}
main{padding:18px clamp(10px,3vw,16px);}
@media (max-width:359px){main .fld label .u{display:none;}}
main .fld input{border-radius:6px;border:1px solid #d6d8dc;background:#fff;color:#20305a;font-family:"Manrope",-apple-system,sans-serif;}
main .fld input.n{font-family:"Manrope",-apple-system,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;}
main .fld input:focus{border-color:#1a5632;box-shadow:0 0 0 3px rgba(26,86,50,.15);}
main .obs-btn{border-radius:6px;border-color:#d6d8dc;color:#3ea8e0;font-family:"Manrope",-apple-system,sans-serif;font-weight:600;}
main .obs-btn.has{background:#fbf7f3;color:#20305a;border-color:#d6d8dc;}
main .obs-l{color:#666;letter-spacing:.08em;}
main .empty{color:#666;}
</style>
</head>

<script>
(function(){
"use strict";
var KEY="pst-lecturas-contadores-v2";
var DEF=[["Muelle Espera",1,2],["Dique Levante",3,28],["Pantalán 1",29,53],["Pantalán 5 Estribor",318,351],
 ["Pantalán 5 Babor",352,378],["Muelle Ribera",379,401],["Muelle Contradique",402,412],["Pantalán 6",413,423],
 ["Contradique Gasolinera",534,541],["Pantalán 10",542,548],["Extra",["Junto gasolinera","Delfín 24","Punta Barbesula"]]];
function defBlocks(){return DEF.map(function(d,i){return Array.isArray(d[1])?{id:"b"+i,name:d[0],items:d[1].slice()}:{id:"b"+i,name:d[0],from:d[1],to:d[2]};});}
var st={blocks:defBlocks(),data:{},cur:"b0",scroll:{},order:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p){st.data=p.data||{};if(p.cur)st.cur=p.cur;st.order=p.order||{};}}}catch(e){}
st.blocks.forEach(function(b){if(b.name==="Pantalán 5 Babor"&&b.from===319&&b.to===378)b.from=352;});
if(!st.blocks.some(function(b){return b.id===st.cur;}))st.cur=st.blocks[0].id;
var saveT;function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify({blocks:st.blocks,data:st.data,cur:st.cur,order:st.order}));}catch(e){}},250);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function nums(b){if(b.items)return b.items.slice();var a=[],f=Math.min(b.from,b.to),t=Math.max(b.from,b.to);for(var i=f;i<=t;i++)a.push(i);return a;}
function rec(bid,n){return (st.data[bid]||{})[n]||{};}
function isFull(r){return !!(r.e&&String(r.e).trim()&&r.a&&String(r.a).trim());}
function stats(b){var d=0,ns=nums(b);ns.forEach(function(n){if(isFull(rec(b.id,n)))d++;});return {d:d,t:ns.length};}
var M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var D=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var now=new Date();$("fecha").textContent="Puerto Sotogrande · "+D[now.getDay()]+" "+now.getDate()+" de "+M[now.getMonth()]+" "+now.getFullYear();

function renderTotals(){var d=0,t=0;st.blocks.forEach(function(b){var s=stats(b);d+=s.d;t+=s.t;});
 $("tot").textContent=d+" / "+t;$("barFill").style.width=(t?d/t*100:0)+"%";}
function tabCount(b){var s=stats(b);return s.d+"/"+s.t;}
function renderTabs(){
 $("tabs").innerHTML=st.blocks.map(function(b){var s=stats(b);
  return '<button class="tab'+(b.id===st.cur?' active':'')+(s.t&&s.d===s.t?' done':'')+'" data-id="'+b.id+'">'+esc(b.name)+'<span class="count">'+s.d+'/'+s.t+'</span></button>';}).join("");
 var a=$("tabs").querySelector(".tab.active");if(a)a.scrollIntoView({block:"nearest",inline:"center"});
}
function updateTab(bid){var el=$("tabs").querySelector('[data-id="'+bid+'"]');var b=st.blocks.find(function(x){return x.id===bid;});if(!el||!b)return;
 var s=stats(b);el.querySelector(".count").textContent=s.d+"/"+s.t;el.classList.toggle("done",s.t>0&&s.d===s.t);
 var zs=$("zoneProg");if(zs&&bid===st.cur)zs.textContent=s.d+" de "+s.t+" completos";}
var TICK='<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function obsBtn(o){return o&&String(o).trim()?'<button type="button" class="obs-btn has" data-obs="1"><span class="obs-l">Observaciones</span>'+esc(o)+'</button>':'<button type="button" class="obs-btn" data-obs="1">＋ Añadir observaciones</button>';}
function renderMain(){
 var b=st.blocks.find(function(x){return x.id===st.cur;});
 if(!b){$("main").innerHTML='<div class="empty">No hay bloques. </div>';return;}
 var s=stats(b),ns=nums(b),desc=!!(st.order&&st.order[b.id]);if(desc)ns=ns.slice().reverse();
 var h='<div class="zone-header"><div><div class="zone-title">'+esc(b.name)+'</div><div class="zone-sub">'+(b.items?b.items.length+' puntos':'Atraques '+Math.min(b.from,b.to)+' – '+Math.max(b.from,b.to))+'</div></div><div class="zone-side"><div class="zone-sub" id="zoneProg">'+s.d+' de '+s.t+' completos</div><button type="button" class="order-btn'+(desc?' desc':'')+'" id="orderBtn">'+(desc?'Orden Descend.':'Orden Ascend.')+'</button></div></div><div class="list">';
 ns.forEach(function(n){var r=rec(b.id,n);
  h+='<div class="card'+(isFull(r)?' full':'')+(b.items?' lbl':'')+'" data-n="'+esc(n)+'">'+
   '<div class="num">'+esc(n)+'</div>'+
   '<div class="row">'+
    '<div class="fld el"><label>⚡ Electricidad <span class="u">kWh</span></label><input class="n" data-f="e" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" value="'+esc(r.e)+'"></div>'+
    '<div class="fld ag"><label>💧 Agua <span class="u">m³</span></label><input class="n" data-f="a" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="next" value="'+esc(r.a)+'"></div>'+
   '</div>'+
   '<div class="fld obs">'+obsBtn(r.o)+'</div>'+
  '</div>';});
 h+='</div>';$("main").innerHTML=h;$("main").scrollTop=st.scroll[b.id]||0;
}
function render(){renderTabs();renderMain();renderTotals();}

$("tabs").addEventListener("click",function(e){var t=e.target.closest(".tab");if(!t)return;st.scroll[st.cur]=$("main").scrollTop;st.cur=t.dataset.id;save();render();});
$("main").addEventListener("input",function(e){var inp=e.target;if(!inp.dataset.f)return;var card=inp.closest(".card");var n=card.dataset.n;
 if(inp.dataset.f!=="o"){var v=inp.value.replace(/[^0-9]/g,"");if(v!==inp.value)inp.value=v;}
 st.data[st.cur]=st.data[st.cur]||{};var r=st.data[st.cur][n]=st.data[st.cur][n]||{};r[inp.dataset.f]=inp.value;
 if(!r.e&&!r.a&&!r.o)delete st.data[st.cur][n];
 card.classList.toggle("full",isFull(r));updateTab(st.cur);renderTotals();save();});

/* ===== Compartir PDF ===== */
function pad(n){return (n<10?"0":"")+n;}
var PW=210,PH=297;
/* Adaptadores de dibujo: el mismo diseño se pinta en PDF (jsPDF) o en canvas (vista previa) */
function pdfDrawer(doc){return {
 page:function(p){if(p)doc.addPage();},
 fill:function(c){doc.setFillColor(c[0],c[1],c[2]);},stroke:function(c){doc.setDrawColor(c[0],c[1],c[2]);},
 ink:function(c){doc.setTextColor(c[0],c[1],c[2]);},lw:function(w){doc.setLineWidth(w);},
 font:function(bold,sz){doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(sz);},
 w:function(t){return doc.getTextWidth(t);},
 rect:function(x,y,w,h,m){doc.rect(x,y,w,h,m);},line:function(a,b,c,d){doc.line(a,b,c,d);},
 text:function(t,x,y,al){doc.text(t,x,y,al?{align:al}:undefined);}};}
function canvasDrawer(ctx,k){var fs=8,bold=false,f="#000",st="#000",ic="#000";
 function setF(){ctx.font=(bold?"bold ":"")+(fs*0.3528*k)+"px Helvetica, Arial, sans-serif";}
 function col(c){return "rgb("+c.join(",")+")";}
 return {page:function(){},fill:function(c){f=col(c);},stroke:function(c){st=col(c);},ink:function(c){ic=col(c);},
 lw:function(w){ctx.lineWidth=Math.max(w*k,.5);},font:function(b,sz){bold=b;fs=sz;setF();},
 w:function(t){setF();return ctx.measureText(t).width/k;},
 rect:function(x,y,w,h,m){if(m.indexOf("F")>-1){ctx.fillStyle=f;ctx.fillRect(x*k,y*k,w*k,h*k);}if(m.indexOf("S")>-1||m.indexOf("D")>-1){ctx.strokeStyle=st;ctx.strokeRect(x*k,y*k,w*k,h*k);}},
 line:function(a,b,c,d){ctx.strokeStyle=st;ctx.beginPath();ctx.moveTo(a*k,b*k);ctx.lineTo(c*k,d*k);ctx.stroke();},
 text:function(t,x,y,al){setF();ctx.fillStyle=ic;ctx.textAlign=al==="right"?"right":al==="center"?"center":"left";ctx.textBaseline="alphabetic";ctx.fillText(t,x*k,y*k);}};}
var ABBR={"Junto gasolinera":"J. Gasolinera","Punta Barbesula":"P. Barbesula"};
function layout(){
 var M=6,HALF=(PW-2*M)/2,RH=4.7,HDR=13,CH=6;
 var rows=[];
 st.blocks.forEach(function(b){rows.push({z:b.name});nums(b).forEach(function(n){var r=rec(b.id,n);rows.push({n:(ABBR[n]||String(n)),e:r.e||"",a:r.a||"",o:r.o||""});});});
 var per=Math.floor((PH-M-HDR-CH-M)/RH);var perPage=per*2;
 return {M:M,HALF:HALF,RH:RH,HDR:HDR,CH:CH,rows:rows,per:per,perPage:perPage,pages:Math.max(1,Math.ceil(rows.length/perPage))};
}
function drawPage(D,L,p){
 var M=L.M,HALF=L.HALF,RH=L.RH,CH=L.CH,per=L.per,rows=L.rows;
 var CW=[16,20,19,HALF-55];
 var NAVY=[32,48,90],GREEN=[26,86,50],LINE=[190,196,204],ZONE=[228,241,231],ALT=[246,247,249],WHITE=[255,255,255];
 var d=new Date(),fecha=pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
 function fit(t,w,fs,min,b){D.font(b,fs);while(fs>min&&D.w(t)>w){fs-=0.5;D.font(b,fs);}
  if(D.w(t)>w){while(t.length>1&&D.w(t+"…")>w)t=t.slice(0,-1);t+="…";}return t;}
 D.fill(NAVY);D.rect(M,M,PW-2*M,9,"F");
 D.ink(WHITE);D.font(true,10.5);D.text("Lecturas de Contadores · Puerto Sotogrande",M+3,M+6);
 D.font(false,8.5);D.text(fecha+"   ·   Pág. "+(p+1)+"/"+L.pages,PW-M-3,M+6,"right");
 for(var h=0;h<2;h++){
  var x0=M+h*HALF,y=M+L.HDR,x;
  D.fill(GREEN);D.rect(x0,y,HALF,CH,"F");D.ink(WHITE);
  x=x0;["Nº Atraque","Electricidad","Agua","Observaciones"].forEach(function(t,k){var tt=fit(t,CW[k]-2,7.5,5.5,true);D.text(tt,x+CW[k]/2,y+4,"center");x+=CW[k];});
  y+=CH;
  for(var r=0;r<per;r++){
   var idx=p*L.perPage+h*per+r;if(idx>=rows.length)break;var row=rows[idx];
   D.stroke(LINE);D.lw(0.15);
   if(row.z){D.fill(ZONE);D.rect(x0,y,HALF,RH,"FD");D.ink(GREEN);var zt=fit(row.z.toUpperCase(),HALF-4,7.5,6,true);D.text(zt,x0+2,y+3.35);}
   else{
    if(r%2){D.fill(ALT);D.rect(x0,y,HALF,RH,"F");}
    x=x0;CW.forEach(function(w){D.rect(x,y,w,RH,"S");x+=w;});
    D.ink(NAVY);
    var nt=fit(row.n,CW[0]-1.5,8,5,true);D.text(nt,x0+CW[0]/2,y+3.35,"center");
    if(row.e){var et=fit(row.e,CW[1]-2,8,6,false);D.text(et,x0+CW[0]+CW[1]-1.5,y+3.35,"right");}
    if(row.a){var at=fit(row.a,CW[2]-2,8,6,false);D.text(at,x0+CW[0]+CW[1]+CW[2]-1.5,y+3.35,"right");}
    if(row.o){var ot=fit(row.o,CW[3]-2,7,5.5,false);D.text(ot,x0+CW[0]+CW[1]+CW[2]+1.2,y+3.35);}
   }
   y+=RH;
  }
 }
 D.stroke(NAVY);D.lw(0.4);D.line(M+HALF,M+L.HDR,M+HALF,M+L.HDR+CH+per*RH);
}
function fileName(){var d=new Date();return "Lecturas_Contadores_"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".pdf";}
function buildPDF(){
 var J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error("nolib");
 var doc=new J({unit:"mm",format:"a4",orientation:"portrait"});var D=pdfDrawer(doc),L=layout();
 for(var p=0;p<L.pages;p++){D.page(p);drawPage(D,L,p);}
 return {blob:doc.output("blob"),name:fileName()};
}
function openPreview(){
 var L=layout(),box=$("pvPages");box.innerHTML="";
 var cssW=Math.min(box.clientWidth||window.innerWidth,820)-24,dpr=Math.min(window.devicePixelRatio||1,3);
 var k=cssW/PW*dpr;
 for(var p=0;p<L.pages;p++){var c=document.createElement("canvas");c.width=Math.round(PW*k);c.height=Math.round(PH*k);
  c.style.width=cssW+"px";c.style.height=(cssW*PH/PW)+"px";c.className="pv-page";
  var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);drawPage(canvasDrawer(ctx,k),L,p);box.appendChild(c);}
 $("pvInfo").textContent=L.pages+(L.pages===1?" página":" páginas")+" · A4";
 $("preview").classList.add("open");box.scrollTop=0;
}
$("shareBtn").onclick=function(){closeCfg();openPreview();};
$("pvBack").onclick=function(){$("preview").classList.remove("open");};
var dlP=null;try{if(window.claude&&window.claude.use)dlP=window.claude.use("downloads");}catch(e){}
$("pvShare").onclick=async function(){
 var out;try{out=buildPDF();}catch(e){toast(e.message==="nolib"?"Sin conexión: no se pudo preparar el PDF":"Error al crear el PDF");return;}
 var file=null;try{file=new File([out.blob],out.name,{type:"application/pdf"});}catch(e){}
 if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:"Lecturas de Contadores"});return;}
  catch(e){if(e&&e.name==="AbortError")return;}
 }
 try{if(!dlP){try{if(window.claude&&window.claude.use)dlP=window.claude.use("downloads");}catch(_){}}
  var dl=dlP?await dlP:null;
  if(dl){await dl.save({filename:out.name,data:out.blob});return;}
 }catch(e){if(e&&e.code==="declined")return;}
 try{var u=URL.createObjectURL(out.blob),ln=document.createElement("a");ln.href=u;ln.download=out.name;document.body.appendChild(ln);ln.click();ln.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);return;}catch(e){}
 toast("Este dispositivo no permite compartir desde aquí");
};
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},1800);}

render();
})();
</script>
